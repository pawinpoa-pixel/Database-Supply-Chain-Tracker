services:
  - type: web
    name: supply-chain-tracker
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /api/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: supply-chain-tracker-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "true"

databases:
  - name: supply-chain-tracker-db
    plan: free
    region: singapore
    databaseName: supply_chain_tracker
    user: supply_chain_app
